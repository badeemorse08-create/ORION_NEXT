name: D4 exact source evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact PR source commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  d4-exact-source-verification:
    name: D4 exact source verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha }}
      EVIDENCE_DIR: /tmp/d4-exact-source-evidence

    steps:
      - name: Prepare external evidence directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$SOURCE_SHA" > "$EVIDENCE_DIR/source_sha.txt"
          printf 'RUN_ID=%s\nEVENT=%s\nREF=%s\nSOURCE_SHA=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$SOURCE_SHA" \
            > "$EVIDENCE_DIR/metadata.txt"

      - name: Checkout exact PR source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha }}
          fetch-depth: 1
          clean: true

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$SOURCE_SHA"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$EXPECTED_SHA" > "$EVIDENCE_DIR/expected_sha.txt"
          printf '%s\n' "$ACTUAL_SHA" > "$EVIDENCE_DIR/actual_checkout_sha.txt"
          {
            printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA"
            printf 'ACTUAL_CHECKOUT_SHA=%s\n' "$ACTUAL_SHA"
            if [ "$EXPECTED_SHA" = "$ACTUAL_SHA" ]; then
              printf 'SHA_MATCH=YES\n'
            else
              printf 'SHA_MATCH=NO\n'
              exit 1
            fi
          } | tee "$EVIDENCE_DIR/sha_verification.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install verification dependencies
        working-directory: binansScanner
        run: python -m pip install -r requirements.txt

      - name: Run canonical D4 verification
        working-directory: binansScanner
        shell: bash
        run: |
          set +e
          set -o pipefail
          python verify.py 2>&1 | tee "$EVIDENCE_DIR/verify.log"
          VERIFY_EXIT_CODE=${PIPESTATUS[0]}
          printf 'VERIFY_EXIT_CODE=%s\n' "$VERIFY_EXIT_CODE" | tee "$EVIDENCE_DIR/verify_exit_code.txt"
          exit "$VERIFY_EXIT_CODE"

      - name: Verify working tree is clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain > "$EVIDENCE_DIR/git_status_porcelain.txt"
          if [ -s "$EVIDENCE_DIR/git_status_porcelain.txt" ]; then
            printf 'CLEAN_TREE=NO\n' | tee "$EVIDENCE_DIR/clean_tree.txt"
            cat "$EVIDENCE_DIR/git_status_porcelain.txt"
            exit 1
          fi
          printf 'CLEAN_TREE=YES\n' | tee "$EVIDENCE_DIR/clean_tree.txt"

      - name: Write final evidence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'WORKFLOW=%s\n' "$GITHUB_WORKFLOW"
            printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"
            printf 'ACTUAL_CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)"
            if [ -f "$EVIDENCE_DIR/verify_exit_code.txt" ]; then cat "$EVIDENCE_DIR/verify_exit_code.txt"; fi
            if [ -f "$EVIDENCE_DIR/clean_tree.txt" ]; then cat "$EVIDENCE_DIR/clean_tree.txt"; fi
          } > "$EVIDENCE_DIR/final_summary.txt"

      - name: Upload D4 exact source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-exact-source-evidence
          path: /tmp/d4-exact-source-evidence
          if-no-files-found: error
          retention-days: 14
