name: D2 Workflow Routing Diagnostic

on:
  push:
    branches: [d2/explosive-mover-challenge-20260905]
  workflow_dispatch:

jobs:
  routing-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Print routing context
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
          echo "github.workflow=${{ github.workflow }}"
          echo "github.run_id=${{ github.run_id }}"
          echo "github.run_attempt=${{ github.run_attempt }}"
          git rev-parse HEAD
          git diff --name-only d33da3e7af8f61e7091db0ff9971995a6619b01b HEAD
          test -f .github/workflows/d2-explosive-mover-challenge.yml
          echo "ORIGINAL_WORKFLOW_VISIBLE PASS"

      - name: Parse original workflow YAML
        run: |
          python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('.github/workflows/d2-explosive-mover-challenge.yml').read_text()); print('ORIGINAL_WORKFLOW_YAML_PARSE PASS')"
