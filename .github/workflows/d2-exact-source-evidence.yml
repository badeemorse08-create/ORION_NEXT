name: D2 Exact Source Evidence

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  exact-source-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set source SHA
        id: source
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d2-evidence"
          SOURCE_SHA="${PR_HEAD_SHA}"
          test -n "${SOURCE_SHA}"
          echo "SOURCE_SHA=${SOURCE_SHA}" | tee "$RUNNER_TEMP/d2-evidence/source_sha.txt"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1

      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_CHECKOUT_SHA=${ACTUAL_CHECKOUT_SHA}"
          test "${EXPECTED_SHA}" = "${ACTUAL_CHECKOUT_SHA}"
          {
            echo "EXPECTED_SHA=${EXPECTED_SHA}"
            echo "ACTUAL_CHECKOUT_SHA=${ACTUAL_CHECKOUT_SHA}"
          } > "$RUNNER_TEMP/d2-evidence/exact_source.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        working-directory: binansScanner
        run: python -m pip install -r requirements.txt

      - name: Run full verification
        working-directory: binansScanner
        shell: bash
        run: |
          set -euo pipefail
          python verify.py | tee "$RUNNER_TEMP/d2-evidence/full_verify_output.txt"

      - name: Assert clean tree and exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          STATUS="$(git status --porcelain)"
          echo "EXPECTED_SHA=${EXPECTED_SHA}"
          echo "ACTUAL_CHECKOUT_SHA=${ACTUAL_CHECKOUT_SHA}"
          echo "git status --porcelain:"
          printf '%s\n' "${STATUS}"
          test "${EXPECTED_SHA}" = "${ACTUAL_CHECKOUT_SHA}"
          test -z "${STATUS}"
          {
            echo "EXPECTED_SHA=${EXPECTED_SHA}"
            echo "ACTUAL_CHECKOUT_SHA=${ACTUAL_CHECKOUT_SHA}"
            echo "CLEAN_TREE=YES"
          } > "$RUNNER_TEMP/d2-evidence/parity.txt"

      - name: Build evidence bundle
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "SOURCE_SHA=${SOURCE_SHA}"
            echo "ACTUAL_CHECKOUT_SHA=$(git rev-parse HEAD)"
            echo "CLEAN_TREE=YES"
          } > "$RUNNER_TEMP/d2-evidence/run_metadata.txt"

      - name: Upload exact-source evidence
        uses: actions/upload-artifact@v4
        with:
          name: d2-exact-source-evidence
          path: ${{ runner.temp }}/d2-evidence/
          if-no-files-found: error
