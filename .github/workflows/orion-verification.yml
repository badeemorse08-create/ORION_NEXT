name: ORION verification

on:
  push:
    branches:
      - main
      - developer5/**
      - developer1/**
      - developer7/**
      - integration/**
      - verification/**
  pull_request:
    branches:
      - main
      - integration/**
      - developer7/**
      - developer1/**
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact commit SHA to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-binans-scanner:
    name: Canonical ORION Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/orion-verification-evidence"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"

      - name: Resolve exact source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              expected_sha="${{ github.event.pull_request.head.sha }}"
              ;;
            workflow_dispatch)
              expected_sha="${{ inputs.source_sha }}"
              ;;
            *)
              expected_sha="$GITHUB_SHA"
              ;;
          esac
          test -n "$expected_sha"
          printf 'EVENT=%s\nEXPECTED_SHA=%s\n' "$GITHUB_EVENT_NAME" "$expected_sha"
          printf 'expected_sha=%s\n' "$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.expected_sha }}
          fetch-depth: 0

      - name: Assert exact checkout parity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.source.outputs.expected_sha }}"
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_SHA=%s\nACTUAL_CHECKOUT_SHA=%s\n' "$expected" "$actual"
          test "$expected" = "$actual"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: binansScanner/requirements.txt

      - name: Install verification dependencies
        working-directory: binansScanner
        run: python -m pip install -r requirements.txt numpy pandas pandas-ta python-binance

      - name: Verify syntax and full unittest suite
        working-directory: binansScanner
        shell: bash
        run: |
          set -o pipefail
          python verify.py 2>&1 | tee "$EVIDENCE_DIR/test-results.txt"

      - name: Remove ignored test artifacts
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX

      - name: Assert working tree clean
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          printf 'WORKING_TREE_STATUS=%s\n' "$status"
          test -z "$status"

      - name: Build canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.source.outputs.expected_sha }}"
          actual="$(git rev-parse HEAD)"
          {
            printf 'repository=badeemorse-gif/ORION_NEXT\n'
            printf 'workflow=ORION verification\n'
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'trigger=%s\n' "$GITHUB_EVENT_NAME"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'expected_sha=%s\n' "$expected"
            printf 'actual_checkout_sha=%s\n' "$actual"
            printf 'test_result=PASS\n'
            printf 'working_tree=clean\n'
            printf 'timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$EVIDENCE_DIR/canonical-evidence.txt"

      - name: Upload canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-verification-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/orion-verification-evidence
          if-no-files-found: error
